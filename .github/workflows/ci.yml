name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync poe fmt-check
      - run: uv run --no-sync poe lint
      - run: uv run --no-sync poe lint-imports
      - run: uv run --no-sync poe typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync poe test

  # Verify direct-dependency lower bounds with current transitive dependencies.
  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv venv
      - run: uv pip install --resolution lowest-direct --group dev -e ".[cli]"
      - run: .venv/bin/pytest -W default::DeprecationWarning

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          wheel="$(ls dist/*.whl)"
          # grep -q would exit early and fail unzip with SIGPIPE under pipefail.
          unzip -l "$wheel" | grep 'my_lib/py.typed'
          # A base install imports the library from site-packages without optional dependencies.
          uv run --isolated --no-project --with "$wheel" python -c \
            "import sys, my_lib; assert 'site-packages' in my_lib.__file__; assert 'structlog' not in sys.modules"
          # The console script exists in a base install and names the missing extra.
          status=0
          output="$(uv run --isolated --no-project --with "$wheel" my-lib 2>&1)" || status=$?
          echo "$output"
          [ "$status" -eq 1 ]
          grep -qF "my-lib[cli]" <<< "$output"
          uv run --isolated --no-project --with "my-lib[cli] @ file://$PWD/$wheel" my-lib greet Ada
      - run: uv run --no-sync properdocs build --strict
      - run: uv run --no-sync poe audit
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .venv
          exit-code: "1"
          severity: CRITICAL,HIGH
